name: Daily family events

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 6:30am in winter, 7:30am in summer
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to save seen_events.json

jobs:
  find-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Find events and email them
        run: python events_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_ADDRESS: ${{ secrets.TO_ADDRESS }}
      - name: Remember what was sent
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add seen_events.json
          git diff --cached --quiet || git commit -m "Update seen events"
          git push
